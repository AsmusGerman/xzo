<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xzo — Todo Memory Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
      }
      #controls {
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #toggle {
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #333;
        border-radius: 6px;
        background: #fff;
      }
      #toggle.mounted {
        background: #fee2e2;
        border-color: #ef4444;
      }
      #status {
        font-size: 13px;
        color: #666;
      }
      #root {
        border: 1px dashed #ccc;
        border-radius: 6px;
        min-height: 48px;
        padding: 8px;
      }
      #root:empty::after {
        content: 'component unmounted';
        color: #aaa;
        font-size: 13px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h2>Todo — Memory Leak Demo</h2>
    <p style="font-size:13px;color:#555">
      Mount / unmount the component, then snapshot heap in DevTools → Memory tab
      to verify no <code>ComponentDefinition</code> or signal objects are retained.
    </p>
    <div id="controls">
      <button id="toggle">Mount app</button>
      <span id="status">unmounted</span>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
